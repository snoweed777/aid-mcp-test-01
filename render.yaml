services:
  - type: web
    name: aid-mcp-server
    runtime: python
    region: singapore
    plan: free
    buildCommand: cd mcp-server && pip install -r requirements.txt
    startCommand: cd mcp-server && python mcp_server.py
    envVars:
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: LOG_LEVEL
        value: INFO
